# The documentation site (docs/conf.py): built on every push and pull request (a warning fails it: a broken link,
# a docstring autodoc cannot read, a module that no longer imports), and published to GitHub Pages from main.
# The code reference covers the whole stack from the other repositories' main branches (docs/requirements.txt),
# so it is also rebuilt nightly, as they move without a push here.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                         # one deployment at a time; a newer one replaces a queued one
  group: pages
  cancel-in-progress: false

env:
  QT_QPA_PLATFORM: offscreen          # the GUI's and the KiCad plugin's modules import PySide6

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }      # triangle (mom25d's mesher) has a PyPI wheel for 3.13
      - name: System packages (Doxygen; the libraries PySide6 loads)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install kicad2ems, the stack and the documentation tools
        run: |
          python -m pip install .                     # this checkout first: the other packages require it
          python -m pip install -r docs/requirements.txt
      - name: Build the site
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/_build/html }

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
