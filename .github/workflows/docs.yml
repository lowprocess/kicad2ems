# The documentation site (docs/conf.py): built on every push and pull request
# (a warning fails it: a broken link, a docstring autodoc cannot read, a
# module that no longer imports), and published to GitHub Pages from main. The
# code reference imports every part of kicad2ems, with its extras and compiled
# cores; it is also rebuilt nightly, as its dependencies move.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer one replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # the GUI's and the KiCad plugin's modules import PySide6
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: System packages (Doxygen; the libraries PySide6 loads)
        run: >-
          sudo apt-get update && sudo apt-get install -y
          --no-install-recommends doxygen libegl1 libgl1 libxkbcommon0
          libfontconfig1 libdbus-1-3
      - name: Install kicad2ems and the documentation tools
        run: |
          # every part of kicad2ems with what its modules import (the window's
          # PySide6 and pyqtgraph, the KiCad plugin's client): the code
          # reference imports each module
          python -m pip install -e '.[all,plugin]'
          python -m pip install -r docs/requirements.txt
      - name: The compiled cores (mom25d's, gfdtd's and pcbqs's modules import them)
        run: |
          MOM25D_ARCH=-march=x86-64-v2 python -m kicad2ems.mom25d.core.build
          GFDTD_ARCH=-march=x86-64-v2 python -m kicad2ems.gfdtd.core.build
          PCBQS_ARCH=-march=x86-64-v2 python -m kicad2ems.pcbqs.core.build
      - name: Build the site
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/_build/html }

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
