# The whole stack at once: kicad2ems with every package that builds on it, each from its main branch (or the ref a
# repository_dispatch names), checked out side by side as the tests expect (../kicad2ems next to each repository).
# A change to kicad2ems that breaks a plugin, the GUI or the KiCad plugin fails here, not on someone's machine.
#
# The other repositories can run it for their own changes:
#   gh api repos/lowprocess/kicad2ems/dispatches -f event_type=stack -F 'client_payload[mom25d]=my-branch'
name: stack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [stack]
  schedule:
    - cron: '17 3 * * *'            # nightly: the other repositories' main moves without a push here

env:
  QT_QPA_PLATFORM: offscreen
  MOM25D_GPU: 'off'
  GFDTD_BACKEND: cpu

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false              # a failure on one Python shows whether the others pass too
      matrix:
        python: ['3.13', '3.14']    # triangle (mom25d's mesher): a PyPI wheel on 3.13, built from source on 3.14
    name: stack (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4
        with: { path: kicad2ems }
      - uses: actions/checkout@v4
        with: { repository: lowprocess/emsdev, path: emsdev, ref: "${{ github.event.client_payload.emsdev || 'main' }}" }
      - uses: actions/checkout@v4
        with: { repository: lowprocess/mom25d, path: mom25d, ref: "${{ github.event.client_payload.mom25d || 'main' }}" }
      - uses: actions/checkout@v4
        with: { repository: lowprocess/gfdtd, path: gfdtd, ref: "${{ github.event.client_payload.gfdtd || 'main' }}" }
      - uses: actions/checkout@v4
        with: { repository: lowprocess/kicad2ems-fdtd, path: kicad2ems-fdtd,
                ref: "${{ github.event.client_payload['kicad2ems-fdtd'] || 'main' }}" }
      - uses: actions/checkout@v4
        with: { repository: lowprocess/kicad2ems-gui, path: kicad2ems-gui,
                ref: "${{ github.event.client_payload['kicad2ems-gui'] || 'main' }}" }
      - uses: actions/checkout@v4
        with: { repository: lowprocess/kicad2ems-ipc, path: kicad2ems-ipc,
                ref: "${{ github.event.client_payload['kicad2ems-ipc'] || 'main' }}" }
      - uses: actions/checkout@v4
        with: { repository: lowprocess/dfsynth, path: dfsynth, ref: "${{ github.event.client_payload.dfsynth || 'main' }}" }
      - uses: actions/checkout@v4
        with: { repository: lowprocess/pcbqs, path: pcbqs, ref: "${{ github.event.client_payload.pcbqs || 'main' }}" }
      - uses: actions/checkout@v4
        with: { repository: lowprocess/kicad2ems-fem, path: kicad2ems-fem,
                ref: "${{ github.event.client_payload['kicad2ems-fem'] || 'main' }}" }

      # requires-python is >=3.10: every file at least compiles there (3.12's f-strings had slipped in twice)
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Every package compiles on Python 3.10
        run: python -m compileall -q emsdev/src kicad2ems/src kicad2ems/install.py mom25d/src gfdtd/src kicad2ems-fdtd/src kicad2ems-gui/src kicad2ems-ipc/plugin dfsynth/src pcbqs/src kicad2ems-fem/src

      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - name: System libraries (Qt offscreen, OpenGL; ngspice, pcbqs's circuit runs; gmsh's GL)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ngspice libglu1-mesa libxcursor1 libxinerama1 libxft2
      - name: Install the stack from the checkouts
        run: |
          python kicad2ems/tools/ci_deps.py emsdev 'kicad2ems[test,fast,dumps]' 'mom25d[test,core]' 'gfdtd[test,core]' \
            'kicad2ems-fdtd[test,openems]' 'kicad2ems-gui[test]' 'dfsynth[test]' \
            'pcbqs[test]' 'kicad2ems-fem[test]' > requirements-ci.txt
          echo 'kicad-python>=0.5' >> requirements-ci.txt                # the KiCad plugin's IPC client
          cat requirements-ci.txt
          # PyPI has no triangle >= 20230923 for 3.14: build install.py's pinned commit first (its TRIANGLE_COMMIT)
          if [ '${{ matrix.python }}' = '3.14' ]; then
            # without fused multiply-adds: they break triangle's exact arithmetic and the mesher never ends (install.py)
            CFLAGS="$(sed -n "s/^TRIANGLE_CFLAGS = '\(.*\)'/\1/p" kicad2ems/install.py)" \
              python -m pip install --no-cache-dir "triangle @ git+https://github.com/drufat/triangle.git@$(sed -n "s/^TRIANGLE_COMMIT = '\([0-9a-f]*\)'.*/\1/p" kicad2ems/install.py)"
          fi
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e emsdev -e kicad2ems -e mom25d -e gfdtd -e kicad2ems-fdtd -e kicad2ems-gui -e dfsynth \
            -e pcbqs -e kicad2ems-fem
          python -m pip check || true
      - name: Build the compiled cores
        run: |
          MOM25D_ARCH=-march=x86-64-v2 python -m mom25d.core.build
          GFDTD_ARCH=-march=x86-64-v2 python -m gfdtd.core.build
          PCBQS_ARCH=-march=x86-64-v2 python -m pcbqs.core.build      # (its kernels: otherwise NumPy's twins only)
      - name: The machine, the solvers
        run: python -m emsdev && kicad2ems --check

      # every suite runs even when one before it failed; the job fails if any did
      - name: emsdev
        run: cd emsdev && python -m pytest -q
      - name: kicad2ems (golden summaries, parity, the API)
        if: success() || failure()
        run: cd kicad2ems && python -m pytest -q
      - name: mom25d (with its kicad2ems plugin's parity)
        if: success() || failure()
        timeout-minutes: 30         # a hang fails the step with its traceback (faulthandler) instead of the job's cancel
        run: cd mom25d && python -m pytest -v -o faulthandler_timeout=600 --durations=10
      - name: gfdtd
        if: success() || failure()
        run: cd gfdtd && python -m pytest -q
      - name: kicad2ems-fdtd (the FDTD layer, openEMS's and gfdtd's connections)
        if: success() || failure()
        run: cd kicad2ems-fdtd && python -m pytest -q
      - name: "pcbqs (the power tools, kicad2ems's analysis plugins, the circuit runs on ngspice)"
        if: success() || failure()
        timeout-minutes: 30
        run: cd pcbqs && python -m pytest -q --durations=10
      - name: kicad2ems-gui
        if: success() || failure()
        run: cd kicad2ems-gui && python -m pytest -q
      - name: kicad2ems-ipc
        if: success() || failure()
        run: cd kicad2ems-ipc && python -m pytest -q
      - name: dfsynth (with the line-model cross-check)
        if: success() || failure()
        run: cd dfsynth && python -m pytest -q
      # Elmer for kicad2ems-fem's Elmer runs (R-C2): built once by the installer's script, then from the cache
      - name: Elmer (cached build)
        id: elmer-cache
        if: success() || failure()
        uses: actions/cache@v4
        with:
          path: ~/opt/elmer
          key: elmer-release-26.2.1-${{ runner.os }}-${{ hashFiles('kicad2ems/tools/build_elmer.sh') }}
      - name: Elmer (build)
        if: (success() || failure()) && steps.elmer-cache.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: |
          sudo apt-get install -y --no-install-recommends gfortran cmake libblas-dev liblapack-dev
          bash kicad2ems/tools/build_elmer.sh "$HOME/opt/elmer"
          rm -rf "$HOME/opt/elmer/src"                                  # the cache keeps the install, not the sources
      - name: "kicad2ems-fem (meshes, configs, readers, registry; Elmer's runs on the cached build; no Palace: its runs skip)"
        if: success() || failure()
        run: |
          sudo apt-get install -y --no-install-recommends libgfortran5 libblas3 liblapack3 libgomp1   # Elmer's own
          export K2E_ELMER="$HOME/opt/elmer/bin"
          "$K2E_ELMER/ElmerSolver" -v </dev/null | head -1 || true
          cd kicad2ems-fem && python -m pytest -q -rs

  # What KiCad installs: the KiCad plugin on main with the commits its requirements.txt pins. Fails when the plugin
  # needs a kicad2ems newer than the pins (bump plugin/requirements.txt).
  ipc-pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { repository: lowprocess/kicad2ems-ipc, path: kicad2ems-ipc }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: System libraries (Qt offscreen, OpenGL)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r kicad2ems-ipc/plugin/requirements.txt pytest
      - run: cd kicad2ems-ipc && python -m pytest -q
