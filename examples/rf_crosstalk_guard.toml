# kicad2ems example: the crosstalk pair with a grounded 0.8 mm guard trace
# between the lines, stitched every 4 mm
#   # make the board first (it is not in the repository)
#   python examples/make_rf_examples.py crosstalk_guard \
#       examples/rf_crosstalk_guard
#   kicad2ems examples/rf_crosstalk_guard.toml --preview
#   kicad2ems examples/rf_crosstalk_guard.toml
board   = "rf_crosstalk_guard.kicad_pcb"   # paths are relative to this file
ground  = "B.Cu"
fmin    = 0.5           # GHz
fmax    = 6
points  = 401
out     = "out"
# line model (qucsator if installed, else scikit-rf), compared in the report
fast    = "auto"

[solver.openems]
excite  = ["P1"]
# Debye FR-4: the default fixed conductivity overstates the loss far
# below the band centre
diel    = "wideband"
