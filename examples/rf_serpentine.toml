# kicad2ems example: a 50 ohm serpentine delay line,
# 6 runs 8 mm long 4.5 mm apart, 80.5 mm along its centre line
#   # make the board first (it is not in the repository)
#   python examples/make_rf_examples.py serpentine examples/rf_serpentine
#   kicad2ems examples/rf_serpentine.toml --preview
#   kicad2ems examples/rf_serpentine.toml
board   = "rf_serpentine.kicad_pcb"   # paths are relative to this file
ground  = "B.Cu"
fmin    = 0.5           # GHz
fmax    = 6
points  = 401
out     = "out"
# line model (qucsator if installed, else scikit-rf), compared in the report
fast    = "auto"

[solver.openems]
excite  = ["P1"]
# Debye FR-4: the default fixed conductivity overstates the loss far
# below the band centre
diel    = "wideband"
