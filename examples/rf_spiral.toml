# kicad2ems example: square spiral inductor,
# 3 turns of 0.25 mm strip 0.25 mm apart, 5 mm across, an underpass on In1.Cu;
# ground on B.Cu 0.6 mm below, in series between 50 ohm lines
#   # make the board first (it is not in the repository)
#   python examples/make_rf_examples.py spiral examples/rf_spiral
#   kicad2ems examples/rf_spiral.toml --preview
#   kicad2ems examples/rf_spiral.toml
board   = "rf_spiral.kicad_pcb"   # paths are relative to this file
ground  = "B.Cu"
fmin    = 0.5           # GHz
fmax    = 10
points  = 401
out     = "out"
# line model (qucsator if installed, else scikit-rf), compared in the report
fast    = "auto"

[solver.openems]
excite  = ["P1"]
# Debye FR-4: the default fixed conductivity overstates the loss far
# below the band centre
diel    = "wideband"
