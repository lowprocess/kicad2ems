# kicad2openems run configuration for the generated lumped-element highpass filter (run from the repository root)
#   python examples/make_demo_board.py examples/demo_highpass highpass
#   kicad2openems examples/demo_highpass.kicad_pcb --config examples/demo_highpass.toml --preview
#   kicad2openems examples/demo_highpass.kicad_pcb --config examples/demo_highpass.toml
# 3rd-order Butterworth high-pass, fc = 1 GHz: C1 3.3 pF - L2 3.9 nH to GND - C3 3.3 pF
# (0402, with ESR / ESL fields).
pos     = "examples/demo_highpass-top.pos"
fmin    = 0.1           # GHz
fmax    = 4.0
points  = 391
compare = "examples/demo_highpass_ideal.s2p"
out     = "examples/out"

[openems]
excite  = ["P1"]        # S11 and S21 (S12 by reciprocity)
air     = 5.0
bc      = "auto"        # PEC on the solid bottom plane, MUR elsewhere
end-db  = -27         # the 0.1 GHz start gives the excitation a DC part that leaves a static field at
                      # -28 dB; stopping here changes S by < 0.01 compared with a 1M-step run
