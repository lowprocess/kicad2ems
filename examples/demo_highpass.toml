# kicad2ems run configuration for the generated lumped-element highpass filter
#   python examples/make_demo_board.py examples/demo_highpass highpass
#   kicad2ems examples/demo_highpass.toml --preview
#   kicad2ems examples/demo_highpass.toml
# 3rd-order Butterworth high-pass, fc = 1 GHz: C1 3.3 pF - L2 3.9 nH to GND - C3 3.3 pF
# (0402, with ESR / ESL fields).
board   = "demo_highpass.kicad_pcb"   # paths are relative to this file
pos     = "demo_highpass-top.pos"
fmin    = 0.1           # GHz
fmax    = 4.0
points  = 391
compare = "demo_highpass_ideal.s2p"
out     = "out"

[solver.openems]
excite  = ["P1"]        # S11 and S21 (S12 by reciprocity)
air     = 5.0
bc      = "auto"        # PEC on the solid bottom plane, MUR elsewhere
# the 0.1 GHz start leaves a static field (the energy levels off near -32 dB): the run stops on the
# port signals instead (end-on = "ports", the default), after 200k steps; S within 1e-4 of a 300k-step run
