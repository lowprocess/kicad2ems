# kicad2ems example: two parallel 50 ohm lines 3 mm apart, 40 mm long:
# P1 driven, P2 through, P3 near end, P4 far end
#   # make the board first (it is not in the repository)
#   python examples/make_rf_examples.py crosstalk examples/rf_crosstalk
#   kicad2ems examples/rf_crosstalk.toml --preview
#   kicad2ems examples/rf_crosstalk.toml
board   = "rf_crosstalk.kicad_pcb"   # paths are relative to this file
ground  = "B.Cu"
fmin    = 0.5           # GHz
fmax    = 6
points  = 401
out     = "out"
# line model (qucsator if installed, else scikit-rf), compared in the report
fast    = "auto"

[solver.openems]
excite  = ["P1"]
# Debye FR-4: the default fixed conductivity overstates the loss far
# below the band centre
diel    = "wideband"
