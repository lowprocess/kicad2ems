# kicad2ems run configuration for the generated demo board
#   python examples/make_demo_board.py examples/demo_transition
#   kicad2ems examples/demo_transition.toml
board   = "demo_transition.kicad_pcb"   # paths are relative to this file
pos     = "demo_transition-top.pos"
nets    = ["RF", "GND"]
ground  = "B.Cu"        # solid ground plane (the demo board has only via pads on B.Cu)
no_mask = true
fmin    = 1.0           # GHz
fmax    = 8.0
points  = 401
out     = "out"

[openems]
excite  = ["P1"]        # S11 and S21 (S12 by reciprocity); remove to excite every port
air     = 5.0           # mm of air between the board and the boundary
bc      = "auto"        # PEC on the solid bottom plane, MUR elsewhere
# The default mesh (fine = 0.0375 mm from the 0.15 mm stripline) gets the delay within 0.5 ps; the
# return loss wants more cells through the dielectric (see docs/meshing.md):
nz      = 6             # cells through each dielectric layer
fast    = "skrf"        # also the transmission-line model, compared in the report
# field dumps (frequency-domain planes give PNG maps; no @GHz = time-domain VTK for ParaView)
# dump  = ["E@F.Cu-0.1@2,6", "J@In2.Cu@4", "E@y=5"]
