# kicad2openems run configuration for the generated demo board
#   python examples/make_demo_board.py examples/demo_transition
#   kicad2openems examples/demo_transition.kicad_pcb --config examples/demo_transition.toml
pos     = "examples/demo_transition-top.pos"
nets    = ["RF", "GND"]
ground  = "B.Cu"        # solid ground plane (the demo board has only via pads on B.Cu)
no_mask = true
fmin    = 1.0           # GHz
fmax    = 8.0
points  = 401
out     = "examples/out"

[openems]
excite  = ["P1"]        # S11 and S21 (S12 by reciprocity); remove to excite every port
air     = 5.0           # mm of air between the board and the boundary
bc      = "auto"        # PEC on the solid bottom plane, MUR elsewhere
