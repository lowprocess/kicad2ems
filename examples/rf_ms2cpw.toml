# kicad2ems example: microstrip to grounded CPW and back on 0.8 mm FR-4:
# the same 1.5 mm strip, F.Cu pours closing in to a 1.25 mm gap over 4 mm
# tapers, via fences
#   # make the board first (it is not in the repository)
#   python examples/make_rf_examples.py ms2cpw examples/rf_ms2cpw
#   kicad2ems examples/rf_ms2cpw.toml --preview
#   kicad2ems examples/rf_ms2cpw.toml
board   = "rf_ms2cpw.kicad_pcb"   # paths are relative to this file
ground  = "B.Cu"
fmin    = 1           # GHz
fmax    = 10
points  = 401
out     = "out"
# line model (qucsator if installed, else scikit-rf), compared in the report
fast    = "auto"

[solver.openems]
excite  = ["P1"]
# Debye FR-4: the default fixed conductivity overstates the loss far
# below the band centre
diel    = "wideband"
