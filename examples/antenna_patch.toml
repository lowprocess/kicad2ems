# kicad2ems antenna example: inset-fed patch, 2.45 GHz (1.6 mm FR4)
#   python examples/make_antennas.py patch examples/antenna_patch
#   kicad2ems examples/antenna_patch.toml --preview
#   kicad2ems examples/antenna_patch.toml
board   = "antenna_patch.kicad_pcb"   # paths are relative to this file
mode    = "antenna"     # PML on all sides, air lambda/4, far field: gain, efficiency, patterns
fmin    = 2.0           # GHz
fmax    = 3.0
points  = 401
out     = "out"

[solver.mom25d]
dmax    = 2.0           # mm (--solvers mom): lambda_g / 30; 1 mm gave the same resonance, S11 and gain
