# kicad2openems antenna example: printed half-wave dipole, centre gap port (73 ohm), 2.45 GHz (run from the repository root)
#   python examples/make_antennas.py dipole examples/antenna_dipole
#   kicad2openems examples/antenna_dipole.kicad_pcb --config examples/antenna_dipole.toml --preview
#   kicad2openems examples/antenna_dipole.kicad_pcb --config examples/antenna_dipole.toml
mode    = "antenna"     # PML on all sides, air lambda/4, far field: gain, efficiency, patterns
fmin    = 1.5           # GHz
fmax    = 3.5
points  = 401
out     = "examples/out"
