# kicad2ems antenna example: printed half-wave dipole, centre gap port (73 ohm), 2.45 GHz
#   python examples/make_antennas.py dipole examples/antenna_dipole
#   kicad2ems examples/antenna_dipole.toml --preview
#   kicad2ems examples/antenna_dipole.toml
board   = "antenna_dipole.kicad_pcb"   # paths are relative to this file
mode    = "antenna"     # PML on all sides, air lambda/4, far field: gain, efficiency, patterns
fmin    = 1.5           # GHz
fmax    = 3.5
points  = 401
out     = "out"
