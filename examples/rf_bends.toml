# kicad2ems example: three 50 ohm right-angle bends on 0.8 mm FR-4:
# square (P1 / P2), mitred (P3 / P4), curved (P5 / P6)
#   # make the board first (it is not in the repository)
#   python examples/make_rf_examples.py bends examples/rf_bends
#   kicad2ems examples/rf_bends.toml --preview
#   kicad2ems examples/rf_bends.toml
board   = "rf_bends.kicad_pcb"   # paths are relative to this file
ground  = "B.Cu"
fmin    = 1           # GHz
fmax    = 12
points  = 401
out     = "out"
# line model (qucsator if installed, else scikit-rf), compared in the report
fast    = "auto"

[solver.openems]
excite  = ["P1", "P3", "P5"]
# Debye FR-4: the default fixed conductivity overstates the loss far
# below the band centre
diel    = "wideband"
