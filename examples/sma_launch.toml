# kicad2ems run configuration for an SMA edge launch (Molex 73251-1151
# end-launch jack) onto a 50 ohm line on a 4-layer board, straight onto the
# connector pad (no taper: it matched worse). 1-6 GHz.
#   # line model + qucsator in a second
#   kicad2ems examples/sma_launch.toml --preview
#   # openEMS, about a minute
#   kicad2ems examples/sma_launch.toml
# The board's ground planes end at the board edges with no stitching there: edge
# walls stand in for it (without them the plane pair beyond the last via row
# resonates near 4.7 GHz). Reference result:
# examples/reference/sma_launch_openems.s2p (use with --compare)
board    = "sma_launch.kicad_pcb"
pos      = "sma_launch-all.pos"
nets     = ["REF_SMA_N", "GND"]
mask     = false
fmin     = 1.0          # GHz
fmax     = 6.0
points   = 401
out      = "out"
# PEC where the planes end at every board edge (stitching stand-in)
edge_walls = "all"
fast       = "auto"         # qucsator if installed, else scikit-rf

[solver.openems]
excite     = ["P1"]     # S11 and S21 (S12 by reciprocity)
end_db     = -30
