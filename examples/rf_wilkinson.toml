# kicad2ems example: Wilkinson power divider, 2.4 GHz, 70.7 ohm arms, 100 ohm resistor, 0.8 mm FR-4
#   python examples/make_rf_examples.py wilkinson examples/rf_wilkinson     # make the board first (it is not in the repository)
#   kicad2ems examples/rf_wilkinson.toml --preview
#   kicad2ems examples/rf_wilkinson.toml
# P1 in, P2 / P3 out (-3 dB each); P2 driven too, for the output match and isolation S32 (resistor R1)
board   = "rf_wilkinson.kicad_pcb"   # paths are relative to this file
ground  = "B.Cu"
fmin    = 1.0           # GHz
fmax    = 4.0
points  = 301
out     = "out"
fast    = "auto"        # line model (qucsator if installed, else scikit-rf), compared in the report

[solver.openems]
fine    = 0.1     # mm at the copper edges: the 0.81 mm arms and the resistor pads
# examples/reference: this mesh, S21 / S22 / S32 at 2.4 GHz -3.34 / -20.2 / -35.3 dB. Not converged on the deep
# figures: --converge 2,4,6 gives -3.35 / -21.2 / -32.2 dB (x4 and x6 within 0.1 dB; x6 3.1 M cells, 16 min)
excite  = ["P1", "P2"]
