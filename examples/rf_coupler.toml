# kicad2ems example: 10 dB edge-coupled quarter-wave directional coupler, 2.4 GHz, 0.8 mm FR-4
#   python examples/make_rf_examples.py coupler examples/rf_coupler     # regenerate the board (already in the repository)
#   kicad2ems examples/rf_coupler.toml --preview
#   kicad2ems examples/rf_coupler.toml
# lines 1.28 mm, gap 0.14 mm, 17.5 mm coupled; P1 in, P2 through, P3 coupled (near end, -10 dB), P4 isolated
board   = "rf_coupler.kicad_pcb"   # paths are relative to this file
ground  = "B.Cu"
fmin    = 1.0           # GHz
fmax    = 4.0
points  = 301
out     = "out"
fast    = "auto"        # line model (qucsator if installed, else scikit-rf), compared in the report

[solver.openems]
fine    = 0.012   # mm at the copper edges. The 0.14 mm gap needs a fine mesh: S31 at 2.4 GHz is -8.56 dB at
res     = 60      # fine 0.035 / res 20 / nz 4, -9.21 dB at 1.5x that and -9.93 dB at 3x (these settings, 83 s);
nz      = 12      # mom25d -10.9 dB. Still not fully converged at 3x
excite  = ["P1"]
