# kicad2ems antenna example: aperture-coupled patch, 2.45 GHz,
# 4 layers of 0.8 mm FR4: patch on F.Cu, slotted ground on In2.Cu,
# 50 ohm feed on B.Cu
#   python examples/make_antennas.py aperture examples/antenna_aperture
#   kicad2ems examples/antenna_aperture.toml --preview
#   kicad2ems examples/antenna_aperture.toml
board   = "antenna_aperture.kicad_pcb"   # paths are relative to this file
# PML on all sides, air lambda/4, far field: gain, efficiency, patterns
mode    = "antenna"
fmin    = 2           # GHz
fmax    = 3
points  = 401
out     = "out"
solvers = ["gfdtd"]     # a slotted plane between two signal layers: FDTD

[solver.mom25d]
# mm (--solvers mom25d): at the 0.3 mm default the patch makes the whole stack
# 78,458 unknowns, past 16 GB; 1 mm 8,384 in 19 s, 2 mm 2,568 in 8 s, both
# 0.19 from openEMS (2026-11-15)
dmax    = 1.0
