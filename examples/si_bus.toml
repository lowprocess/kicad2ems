# kicad2ems example: three traces side by side on a 4-layer board:
# the crosstalk between them (kicad2ems.si)
#   # make the board first (it is not in the repository)
#   python examples/make_rf_examples.py bus examples/rf_bus
#   kicad2ems study examples/si_bus.toml
# D0, D1, D2: 50 ohm over the In1.Cu plane, 0.2 mm apart for 30 mm, fanned out
# at both ends. The question puts a port at each trace's two ends itself. For a
# 100 ps edge: NEXT 6.0 %, FEXT -6.5 % from a neighbour (gfdtd beside the line
# model: 6.0 % and -7.4 %), 12 % and 13 % at the middle trace with both its
# neighbours switching.
board   = "rf_bus.kicad_pcb"   # paths are relative to this file
ground  = "In1.Cu"
out     = "out"

[study]
run = ["crosstalk"]

# [study.crosstalk]
# engine = "line model + gfdtd"  # a full-wave solver on the same ports beside
#                                # the line model: its figures the answer

[analysis.crosstalk]
# the traces, by net; each is the aggressor in turn
nets   = ["D0", "D1", "D2"]
ground = "In1.Cu"
rise   = 100                    # ps, 10 to 90 %
limit  = 3                      # % of the swing
