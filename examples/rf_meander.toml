# kicad2ems example: meander inductor in series with a 50 ohm line:
# a 0.3 mm strip, 5 runs 4 mm long, 0.9 mm apart
#   # make the board first (it is not in the repository)
#   python examples/make_rf_examples.py meander examples/rf_meander
#   kicad2ems examples/rf_meander.toml --preview
#   kicad2ems examples/rf_meander.toml
board   = "rf_meander.kicad_pcb"   # paths are relative to this file
ground  = "B.Cu"
fmin    = 0.5           # GHz
fmax    = 10
points  = 401
out     = "out"
# line model (qucsator if installed, else scikit-rf), compared in the report
fast    = "auto"

[solver.openems]
excite  = ["P1"]
# Debye FR-4: the default fixed conductivity overstates the loss far
# below the band centre
diel    = "wideband"
