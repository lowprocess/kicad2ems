# kicad2ems example: grounded coplanar waveguide through line, 50 ohm, via fences, 0.8 mm FR-4
#   python examples/make_rf_examples.py gcpw examples/rf_gcpw     # regenerate the board (already in the repository)
#   kicad2ems examples/rf_gcpw.toml --preview
#   kicad2ems examples/rf_gcpw.toml
# strip 1.0 mm, gaps 0.22 mm; the F.Cu pours are stitched to B.Cu every 1.2 mm along both gaps
board   = "rf_gcpw.kicad_pcb"   # paths are relative to this file
ground  = "B.Cu"
fmin    = 1.0           # GHz
fmax    = 10.0
points  = 401
out     = "out"
fast    = "auto"        # line model (qucsator if installed, else scikit-rf), compared in the report

[solver.openems]
fine    = 0.025   # mm at the copper edges, the 0.22 mm gaps: S11 at 5 GHz is -18.9 dB at fine 0.05 / res 20 /
res     = 40      # nz 4 and -26.1 dB at 2x that (these settings); mom25d -31.4 dB. Not converged at 2x
nz      = 8
excite  = ["P1"]
