# kicad2openems run configuration for the microstrip filter board (run from the repository root)
#   kicad2openems examples/filter.kicad_pcb --config examples/filter.toml --preview
#   kicad2openems examples/filter.kicad_pcb --config examples/filter.toml
# Reference result: examples/reference/filter_openems.s2p (use with --compare)
pos     = "examples/filter-all.pos"
nets    = ["RF", "GND"]
no_mask = true
fmin    = 1.0           # GHz
fmax    = 8.0
points  = 401
out     = "examples/out"

[openems]
excite  = ["P1"]        # S11 and S21 (S12 by reciprocity); remove to excite every port
air     = 5.0           # mm of air between the board and the boundary
bc      = "auto"        # PEC on the solid bottom plane, MUR elsewhere
end-db  = -40
fine    = 0.05
