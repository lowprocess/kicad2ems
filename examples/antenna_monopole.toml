# kicad2ems antenna example: meander monopole above a finite 60 mm ground, 2.45 GHz, 0.8 mm FR4
#   python examples/make_antennas.py monopole examples/antenna_monopole
#   kicad2ems examples/antenna_monopole.toml --preview
#   kicad2ems examples/antenna_monopole.toml
board   = "antenna_monopole.kicad_pcb"   # paths are relative to this file
mode    = "antenna"     # PML on all sides, air lambda/4, far field: gain, efficiency, patterns
fmin    = 1.8           # GHz
fmax    = 3.4
points  = 401
out     = "out"
solvers = ["gfdtd"]     # the ground is half the antenna: FDTD (mom25d assumes an infinite one)
