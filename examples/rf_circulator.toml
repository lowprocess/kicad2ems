# kicad2ems example: a microstrip Y-junction circulator at 9.2 GHz built on the
# Draw page (rf_circulator_shapes.json): a garnet puck (4 pi Ms 1200 G, er 15)
# set into a bare 0.508 mm RO4003C board under a copper junction disc, three
# 50 ohm arms with 30 ohm quarter-wave transformers and three ports, and a
# NdFeB magnet (Br 1.2 T, 8 mm across) 2 mm over the copper to saturate the
# puck. Board and drawing: python examples/make_rf_examples.py circulator
#   kicad2ems examples/rf_circulator.toml          (auto: gfdtd)
# The magnetised ferrite runs on gfdtd only (openEMS and Palace have no
# gyrotropic medium; mom25d no solids).
# 2026-11-27 (RX 7800 XT, 0.94 M cells, 2 s a port; the puck magnetised along
# its own field, 36 deg off z on the mean): at 9.22 GHz S21 -0.23 dB, S31
# -29.5 dB, S11 -31.5 dB, both better than 20 dB from 8.68 to 9.66 GHz.
# Without the magnet the puck is unbiased and the junction reciprocal (S21,
# S31 -3.8, -3.9 dB); reversed (br -1.2 in the drawing) P1 goes to P3.
board   = "rf_circulator.kicad_pcb"   # paths are relative to this file
shapes  = "rf_circulator_shapes.json"
ports   = ["P1@0.6000,10.3925,F.Cu,0", "P2@17.6536,0.6002,F.Cu,240",
           "P3@17.6536,20.1848,F.Cu,120"]
ground  = "B.Cu"
fmin    = 6.0           # GHz
fmax    = 14.0
points  = 401
out     = "out"

[solver.openems]
bc      = "MUR"
air     = 2.0
fine    = 0.1
excite  = ["P1"]
max_steps = 2000000
