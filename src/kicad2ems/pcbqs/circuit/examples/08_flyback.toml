# pcbqs circuit example: two coupled inductors as the transformer, an RCD clamp
# for the leakage, a diode on the secondary
#   # the circuit alone, from the command line
#   python -m kicad2ems.pcbqs.circuit 08_flyback.json --out out/flyback
#   # the circuit on its board, in the window
#   kicad2ems-gui: File > Examples > Circuits
board = "08_flyback.kicad_pcb"   # paths are relative to this file
out   = "out"

[analysis]
# a Run of the window: the circuit, then the board's temperature from its losses
# (no S-parameters)
run = ["circuit", "thermal"]

[analysis.circuit]
# the parts, nodes and drives: the Circuit page's schematic
model = "08_flyback.json"
