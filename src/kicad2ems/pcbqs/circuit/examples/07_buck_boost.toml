# pcbqs circuit example: the inductor is charged from the input and discharged
# into a negative output
#   # the circuit alone, from the command line
#   python -m kicad2ems.pcbqs.circuit 07_buck_boost.json --out out/buck_boost
#   # the circuit on its board, in the window
#   kicad2ems-gui: File > Examples > Circuits
board = "07_buck_boost.kicad_pcb"   # paths are relative to this file
out   = "out"

[analysis]
# a Run of the window: the circuit, then the board's temperature from its losses
# (no S-parameters)
run = ["circuit", "thermal"]

[analysis.circuit]
# the parts, nodes and drives: the Circuit page's schematic
model = "07_buck_boost.json"
