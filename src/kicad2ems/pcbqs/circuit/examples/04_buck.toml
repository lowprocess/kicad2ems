# pcbqs circuit example: non-synchronous buck: the duty is adjusted until the
# output is 5 V into a resistive load
#   # the circuit alone, from the command line
#   python -m kicad2ems.pcbqs.circuit 04_buck.json --out out/buck
#   # the circuit on its board, in the window
#   kicad2ems-gui: File > Examples > Circuits
board = "04_buck.kicad_pcb"   # paths are relative to this file
out   = "out"

[analysis]
# a Run of the window: the circuit, then the board's temperature from its losses
# (no S-parameters)
run = ["circuit", "thermal"]

[analysis.circuit]
# the parts, nodes and drives: the Circuit page's schematic
model = "04_buck.json"
