# pcbqs circuit example: two complementary switches drive a series LC and a
# resistor above resonance; no target, a sweep of the frequency
#   # the circuit alone, from the command line
#   python -m kicad2ems.pcbqs.circuit 09_half_bridge_resonant.json \
#       --out out/half_bridge_resonant
#   # the circuit on its board, in the window
#   kicad2ems-gui: File > Examples > Circuits
board = "09_half_bridge_resonant.kicad_pcb"   # paths are relative to this file
out   = "out"

[analysis]
# a Run of the window: the circuit, then the board's temperature from its losses
# (no S-parameters)
run = ["circuit", "thermal"]

[analysis.circuit]
# the parts, nodes and drives: the Circuit page's schematic
model = "09_half_bridge_resonant.json"
