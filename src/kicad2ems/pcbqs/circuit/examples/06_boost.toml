# pcbqs circuit example: non-synchronous boost: the duty is adjusted until
# the output is 24 V
#   # the circuit alone, from the command line
#   python -m kicad2ems.pcbqs.circuit 06_boost.json --out out/boost
#   # the circuit on its board, in the window
#   kicad2ems-gui: File > Examples > Circuits
board = "06_boost.kicad_pcb"   # paths are relative to this file
out   = "out"

[analysis]
# a Run of the window: the circuit, then the board's temperature from its losses
# (no S-parameters)
run = ["circuit", "thermal"]

[analysis.circuit]
# the parts, nodes and drives: the Circuit page's schematic
model = "06_boost.json"
