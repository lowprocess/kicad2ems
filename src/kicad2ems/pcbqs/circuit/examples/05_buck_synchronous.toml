# pcbqs circuit example: two switches on one drive, the lower its complement
# with dead time; swept over a constant-current load
#   # the circuit alone, from the command line
#   python -m kicad2ems.pcbqs.circuit 05_buck_synchronous.json \
#       --out out/buck_synchronous
#   # the circuit on its board, in the window
#   kicad2ems-gui: File > Examples > Circuits
board = "05_buck_synchronous.kicad_pcb"   # paths are relative to this file
out   = "out"

[analysis]
# a Run of the window: the circuit, then the board's temperature from its losses
# (no S-parameters)
run = ["circuit", "thermal"]

[analysis.circuit]
# the parts, nodes and drives: the Circuit page's schematic
model = "05_buck_synchronous.json"
