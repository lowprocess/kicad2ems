# pcbqs circuit example: a 50 Hz sine through one diode into a reservoir
# capacitor and a resistive load
#   # the circuit alone, from the command line
#   python -m kicad2ems.pcbqs.circuit 02_half_wave_rectifier.json \
#       --out out/half_wave_rectifier
#   # the circuit on its board, in the window
#   kicad2ems-gui: File > Examples > Circuits
board = "02_half_wave_rectifier.kicad_pcb"   # paths are relative to this file
out   = "out"

[analysis]
run = ["circuit"]   # a Run of the window: the circuit (no S-parameters)

[analysis.circuit]
# the parts, nodes and drives: the Circuit page's schematic
model = "02_half_wave_rectifier.json"
