[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dfsynth"
dynamic = ["version"]
description = "Distributed-element microstrip filter synthesis -> KiCad layout, validated with kicad2ems"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
validate = ["kicad2ems"]     # from a kicad2ems checkout: pip install -e /path/to/kicad2ems
test = ["pytest>=7"]

[project.scripts]
dfsynth = "dfsynth.cli:main"

[tool.setuptools.dynamic]
version = {attr = "dfsynth.__version__"}

[tool.setuptools.packages.find]
include = ["dfsynth*"]
