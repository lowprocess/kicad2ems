[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planemodes"
version = "0.1.0"
description = "Plane-pair cavity eigenmodes of PCBs from KiCad, ODB++ or HyperLynx files, with a Qt viewer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Everything is on PyPI as wheels for CPython 3.10-3.14 (Linux x86_64/aarch64,
# Windows, macOS): meshpy carries the Triangle mesher compiled.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "shapely>=2.0",
    "meshpy>=2026.1.1",
    "matplotlib>=3.7",     # point location for the field raster (matplotlib.tri)
    "contourpy>=1.2",      # contour lines
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
planemodes = "planemodes.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
