[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad2ems"
dynamic = ["version"]
description = "KiCad board -> S-parameters from a transmission-line model and plugin solvers: openEMS (3D FDTD), gfdtd (GPU FDTD), mom25d (2.5D MoM)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
authors = [{ name = "Claude", email = "noreply@anthropic.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "shapely>=2.0",
    "matplotlib>=3.7",
    "emsdev @ https://github.com/lowprocess/emsdev/archive/refs/heads/main.zip", # the machine: GPUs, CPU threads, memory (sysinfo)
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
fast = ["scikit-rf>=1.0"]          # --fast skrf: the line model as S-parameters (qucsator: a separate program)
dumps = ["h5py>=3"]                # frequency-domain field dumps (openEMS's own Python package needs it too)
gui = ["kicad2ems-gui @ git+https://github.com/lowprocess/kicad2ems-gui"]   # the window (kicad2ems-gui), its own
                                                                             # repository: PySide6, pyqtgraph, PyOpenGL
core = ["pybind11>=2.10"]          # python -m mom25d.core.build: mom25d's C++ / OpenMP kernels (~5x faster);
                                   # python -m gfdtd.core.build: gfdtd's CPU core (~15x numpy)
# the full-wave solvers, each a package with its kicad2ems plugin (the 'kicad2ems.solvers' entry points)
openems = ["kicad2ems-fdtd[openems] @ git+https://github.com/lowprocess/kicad2ems-fdtd"]   # the FDTD solvers' package,
                                                                # openEMS's side; openEMS and CSXCAD themselves come
                                                                # from elsewhere (README)
mom = ["mom25d @ git+https://github.com/lowprocess/mom25d"]     # the MoM solver and its plugins, mom25d and mixed
                                                                # (it brings triangle, its mesher)
gfdtd = ["kicad2ems-fdtd[gfdtd] @ git+https://github.com/lowprocess/kicad2ems-fdtd"]   # the FDTD solvers' package
                                                                # with gfdtd, the GPU / CPU-core FDTD engine
filter = ["kicad2ems-gui[filter] @ git+https://github.com/lowprocess/kicad2ems-gui"]   # the GUI's Filter page (dfsynth)
all = ["kicad2ems[fast,dumps,gui,core,openems,mom,gfdtd,filter]"]       # everything but a GPU wheel (one of the gpu-* extras)
# mom25d's and gfdtd's GPU solvers (docs/mom.md#gpu): the CuPy wheel built for your
# GPU stack, one of these extras (pip install '.[gpu-rocm7]'), or the wheel itself (pip install cupy-rocm-7-0);
# they conflict: install one. The CUDA wheels need the NVIDIA driver; the ROCm wheel the
# ROCm 7 runtime (rocminfo shows the card). PyTorch is the other backend: its ROCm / CUDA build from pytorch.org.
gpu-cuda12 = ["cupy-cuda12x>=14"]   # NVIDIA, CUDA 12.x driver
gpu-cuda13 = ["cupy-cuda13x>=14"]   # NVIDIA, CUDA 13.x driver
gpu-rocm7 = ["cupy-rocm-7-0>=14"]   # AMD, ROCm 7.0
test = ["pytest>=7", "scikit-rf>=1.0", "h5py>=3"]
# openEMS and CSXCAD are not on PyPI: install them from your distribution or build them from source
# (see README); the openems extra is the plugin that runs them.

[project.scripts]
kicad2ems = "kicad2ems.cli:main"
kicad2openems = "kicad2ems.cli:main_openems"     # the old name: openEMS unless --solvers says otherwise

[tool.setuptools.dynamic]
version = {attr = "kicad2ems.__version__"}

# the examples ship as kicad2ems.examples (examples/ here: the configs, the generators, the boards in the repository;
# not reference/). Listed, not found, for that mapping: tests/test_api.py checks the list against src/.
[tool.setuptools]
package-dir = {"" = "src", "kicad2ems.examples" = "examples"}
include-package-data = false                                    # only what package-data names (not every file here)
packages = ["kicad2ems", "kicad2ems.api", "kicad2ems.fields", "kicad2ems.importers", "kicad2ems.importers.kicad",
            "kicad2ems.lines", "kicad2ems.solvers", "kicad2ems.solvers.lines", "kicad2ems.examples"]

[tool.setuptools.package-data]
"kicad2ems.examples" = ["*.toml", "hairpin.kicad_pcb", "hairpin-top.pos", "rf_interdig.kicad_pcb",       # the boards
                        "rf_interdig.kicad_pro", "rf_interdig-all.pos", "sma_launch.kicad_pcb",       # in the repository:
                        "sma_launch.kicad_pro", "sma_launch-all.pos"]                                 # the others are made

[tool.pytest.ini_options]
testpaths = ["tests"]
