[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad2ems"
dynamic = ["version"]
description = "KiCad board -> S-parameters from openEMS (3D FDTD), mom25d (2.5D MoM) and a transmission-line model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
authors = [{ name = "Claude", email = "noreply@anthropic.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",                 # mom25d
    "shapely>=2.0",
    "matplotlib>=3.7",
    "triangle>=20230923",          # mom25d's surface mesher
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
fast = ["scikit-rf>=1.0"]          # --fast skrf: the line model as S-parameters (qucsator: a separate program)
dumps = ["h5py>=3"]                # frequency-domain field dumps (openEMS's own Python package needs it too)
emerge = ["emerge>=2.8; python_version < '3.14'"]   # --solvers emerge (PyPI's needs Python <= 3.13; 3.14: tools/emerge)
gui = ["PySide6-Essentials>=6.5", "pyqtgraph>=0.13", "h5py>=3", "PyOpenGL>=3.1"]   # kicad2ems-gui (h5py: FD dumps,
                                                                                   # far field; PyOpenGL: 3D fields)
gmsh = ["gmsh>=4.11"]              # mom25d's mesher = "gmsh"
kicad = ["kicad-python>=0.5", "PySide6-Essentials>=6.5", "pyqtgraph>=0.13"]   # the KiCad plugin (IPC API, KiCad 9+)
core = ["pybind11>=2.10"]          # python -m mom25d.core.build: mom25d's C++ / OpenMP kernels (~5x faster);
                                   # python -m gfdtd.core.build: gfdtd's CPU core (~15x numpy)
# mom25d's GPU solvers (docs/mom.md#gpu): the CuPy wheel built for your
# GPU stack, one of these extras (pip install '.[gpu-rocm7]'), or the wheel itself (pip install cupy-rocm-7-0);
# they conflict: install one. The CUDA wheels need the NVIDIA driver; the ROCm wheel the
# ROCm 7 runtime (rocminfo shows the card). PyTorch is the other backend: its ROCm / CUDA build from pytorch.org.
gpu-cuda12 = ["cupy-cuda12x>=14"]   # NVIDIA, CUDA 12.x driver
gpu-cuda13 = ["cupy-cuda13x>=14"]   # NVIDIA, CUDA 13.x driver
gpu-rocm7 = ["cupy-rocm-7-0>=14"]   # AMD, ROCm 7.0
test = ["pytest>=7", "scikit-rf>=1.0", "h5py>=3"]
# openEMS and CSXCAD are not on PyPI: install them from your distribution or build them from source
# (see README); everything except the actual FDTD run works without them.

[project.scripts]
kicad2ems = "kicad2ems.cli:main"
kicad2ems-gui = "kicad2ems.gui:main"
kicad2openems = "kicad2ems.cli:main_openems"     # the old name: openEMS unless --solvers says otherwise
kicad2openems-gui = "kicad2ems.gui:main"
gfdtd = "gfdtd.fdtd:main"                      # run an openEMS XML file on gfdtd (GPU FDTD)
dfsynth = "dfsynth.cli:main"                    # distributed-element filter synthesis -> KiCad board (tools/dfsynth)
kicad2ems-kicad = "kicad2ems.kicadplugin.__main__:main"   # the KiCad plugin's window; install / uninstall it

[tool.setuptools.dynamic]
version = {attr = "kicad2ems.__version__"}

[tool.setuptools.packages.find]
where = [".", "tools/dfsynth"]               # tools/dfsynth: the filter synthesis (the GUI's Filter page, dfsynth)
include = ["kicad2ems*", "mom25d*", "gfdtd*", "dfsynth*"]

[tool.setuptools.package-data]
mom25d = ["core/*.cpp", "*.so", "*.pyd"]
gfdtd = ["core/*.cpp", "core/*.h", "*.so", "*.pyd"]     # the update code (GPU kernels and CPU core), the built core
"kicad2ems.gui" = ["*.svg"]                 # the window's and the application launcher's icon, the wand

[tool.pytest.ini_options]
testpaths = ["tests"]
