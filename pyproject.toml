[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad2ems"
dynamic = ["version"]
description = "KiCad boards as electromagnetic, power-integrity, circuit and thermal simulations: a transmission-line model, openEMS and gfdtd (3D FDTD), mom25d (2.5D MoM), pcbqs (PDN, quasistatics, circuits), Palace and Elmer (FEM), and a window"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
authors = [{ name = "Claude" }, { name = "lowprocess" }]
# one distribution: every part of the stack is a subpackage of kicad2ems (kicad2ems.core, .gui, .fdtd, .gfdtd, .mom25d,
# .pcbqs, .fem, .dfsynth, .ipc, .emsdev), so nothing here names another part by revision. The extras are the
# third-party packages a part needs beyond these
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "shapely>=2.0",
    "matplotlib>=3.7",
    "threadpoolctl>=3.1",          # mom25d, pcbqs: the LU's BLAS threads on the fast cores
    "pillow>=9",                   # pcbqs's reports, the window's saved frames
    "h5py>=3",                     # frequency-domain field dumps, gfdtd's NF2FF results
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
fast = ["scikit-rf>=1.0"]          # --fast skrf: the line model as S-parameters (qucsator: a separate program)
gui = ["PySide6-Essentials>=6.5", "pyqtgraph>=0.13", "PyOpenGL>=3.1"]     # the window (kicad2ems.gui)
fem = ["gmsh>=4.11"]               # Palace and Elmer behind kicad2ems (kicad2ems.fem); the programs come from elsewhere
core = ["pybind11>=2.10",          # the compiled cores, built here: python -m kicad2ems.mom25d.core.build (and
        "setuptools>=61; sys_platform == 'win32'"]   # .pcbqs, .gfdtd); Windows: setuptools finds MSVC
plugin = ["kicad-python>=0.5"]     # the KiCad plugin's IPC client (kicad2ems.ipc)
# the GPU: slangpy (gpu-vulkan), the default on any GPU, or the CuPy wheel built for your GPU stack (they conflict:
# install one). The CUDA wheels need the NVIDIA driver; the ROCm wheel the ROCm 7 runtime
gpu-cuda12 = ["cupy-cuda12x>=14"]   # NVIDIA, CUDA 12.x driver
gpu-cuda13 = ["cupy-cuda13x>=14"]   # NVIDIA, CUDA 13.x driver
gpu-rocm7 = ["cupy-rocm-7-0>=14"]   # AMD, ROCm 7.0
gpu-vulkan = ["slangpy>=0.43"]      # any GPU with a Vulkan driver, Windows or Linux
all = ["kicad2ems[fast,gui,fem,core]"]         # everything but a GPU wheel (one of the gpu-* extras)
test = ["pytest>=7", "pytest-xdist>=3", "scikit-rf>=1.0"]
# the parts that were packages of their own until 0.4: their extras are still accepted, and bring nothing
dumps = []
mom = []
qs = []
gfdtd = []
openems = []
filter = []
# openEMS and CSXCAD are not on PyPI: install them from your distribution or build them (tools/build_openems.sh)

[project.scripts]
kicad2ems = "kicad2ems.core.cli:main"
kicad2openems = "kicad2ems.core.cli:main_openems"     # the old name: openEMS unless --solvers says otherwise
kicad2ems-z0 = "kicad2ems.core.lines.calc:main"       # a stack-up's impedance, without a board
kicad2ems-gui = "kicad2ems.gui:main"
kicad2openems-gui = "kicad2ems.gui:main"              # the old name
gfdtd = "kicad2ems.gfdtd.fdtd:main"                   # run an openEMS XML file, as `openEMS model.xml`
dfsynth = "kicad2ems.dfsynth.cli:main"
kicad2ems-fem-dc = "kicad2ems.fem.elmer.dc:main"
kicad2ems-fem-cap = "kicad2ems.fem.palace.cap:main"
kicad2ems-fem-cap-elmer = "kicad2ems.fem.elmer.cap:main"
kicad2ems-fem-thermal = "kicad2ems.fem.elmer.thermal:main"
kicad2ems-fem-mag = "kicad2ems.fem.elmer.mag:main"

[tool.setuptools.dynamic]
version = {attr = "kicad2ems.__version__"}

# the packages: every one under src/ (setup.py finds them), and kicad2ems.examples, which is examples/ here (the
# configs, the generators, the boards in the repository; not reference/)
[tool.setuptools]
include-package-data = false                                    # only what package-data names (not every file here)

[tool.setuptools.package-data]
"kicad2ems.examples" = ["*.toml", "hairpin.kicad_pcb", "hairpin-top.pos", "rf_interdig.kicad_pcb",       # the boards
                        "rf_interdig.kicad_pro", "rf_interdig-all.pos", "sma_launch.kicad_pcb",       # in the repository:
                        "sma_launch.kicad_pro", "sma_launch-all.pos"]                                 # the others are made
"kicad2ems.ipc" = ["plugin/*"]                               # what KiCad gets: plugin.json, the launcher, the icons
"kicad2ems.gui" = ["*.svg", "*.ico"]                            # the window's and the launcher's icon, the wand
"kicad2ems.gfdtd.core" = ["*.cpp", "*.h"]                       # the update code (GPU kernels and CPU core)
"kicad2ems.mom25d.core" = ["*.cpp"]                             # the core's source (it meshes: emsdev/native)
"kicad2ems.pcbqs" = ["data/*.json", "data/*.toml", "circuit/examples/*.json",
                     "circuit/examples/*.kicad_pcb", "circuit/examples/*.toml", "PROVENANCE.json"]
"kicad2ems.pcbqs.core" = ["*.cpp", "*.hpp"]
"kicad2ems.emsdev" = ["native/*.hpp", "native/CDT/*"]           # what both cores include: the mesher's CDT

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"     # tests/<part>/: the parts' test files share names
markers = ["slow: long solver runs"]

# a core built in this tree (python -m kicad2ems.<part>.core.build) is for this Python and machine: never in a wheel
# (the wheels are py3-none-any until each platform's are built with their cores)
[tool.setuptools.exclude-package-data]
"*" = ["*.so", "*.pyd", "*.dll"]

[tool.ruff]
line-length = 80

# How a statement over 80 columns is laid out (yapf --lines on it): PEP 8,
# continuation lines under the opening bracket, arguments packed
[tool.yapf]
based_on_style = "pep8"
column_limit = 80
split_before_named_assigns = false
allow_split_before_dict_value = false
split_before_arithmetic_operator = true
split_before_logical_operator = true
split_before_bitwise_operator = true
coalesce_brackets = true
each_dict_entry_on_separate_line = false
split_complex_comprehension = true
spaces_before_comment = 2
join_multiple_lines = false

[tool.ruff.format]
quote-style = "preserve"
