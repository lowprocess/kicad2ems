# Read the Docs: the documentation site (docs/conf.py), with the code reference of the whole stack.
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    - doxygen                         # the compiled cores' reference (Breathe)
    - libegl1                         # PySide6 (the GUI's and the KiCad plugin's modules import it)
    - libgl1
    - libxkbcommon0
    - libfontconfig1
    - libdbus-1-3
sphinx:
  configuration: docs/conf.py
python:
  install:
    - method: pip                     # this checkout's kicad2ems first: the others require it
      path: .
    - requirements: docs/requirements.txt
